# Cấu hình cổng chạy máy chủ Spring Boot (mặc định là 8080)
server.port=8081

# --- Cấu hình kết nối MySQL ---
# Thay 'root' và 'yourpassword' bằng username và password MySQL của bạn
spring.datasource.url=jdbc:mysql://localhost:3306/guhastore_products_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Cấu hình Spring Data JPA ---
# Tự động cập nhật CSDL dựa trên code Java (Entity)
# 'update' có nghĩa là nó sẽ tự tạo bảng nếu chưa có. Rất tiện cho lập trình.
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL trong console (giúp debug)
spring.jpa.show-sql=true
jwt.secret=abcdefghijklmnopqrstuvwxyz123456
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
# Cho phép 1 request (tổng cộng) tối đa 10MB
spring.servlet.multipart.max-request-size=10MB